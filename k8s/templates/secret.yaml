apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s.fullname" . }}-secret
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secret.database.password | quote }}
  REDIS_PASSWORD: {{ .Values.secret.redis.password | quote }}
  JWT_SECRET: {{ .Values.secret.jwt.secret | quote }}
  DATABASE_URL: {{ .Values.secret.database.url | quote }}